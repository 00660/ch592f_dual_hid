name: Android Macro App
on:
  push:
    branches: ['feature/self-control-macros']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      CH592_DEBUG_KEYSTORE: ${{ github.workspace }}/build/ci/ch592-debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/cache@v4
        with:
          path: ${{ env.CH592_DEBUG_KEYSTORE }}
          key: macro-app-debug-signing-v2
      - name: Prepare debug signing key
        run: |
          mkdir -p "$(dirname "$CH592_DEBUG_KEYSTORE")"
          if [ ! -f "$CH592_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$CH592_DEBUG_KEYSTORE" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$CH592_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey
      - name: Test and build
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ch592-macro-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/reports/
          if-no-files-found: error
